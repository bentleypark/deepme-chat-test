<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deep_me WebSocket 감정대화 테스트</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }
        
        .container {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
        }
        
        .status {
            padding: 10px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
            text-align: center;
        }
        
        .status.connected {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        
        .status.disconnected {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        
        .status.connecting {
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeaa7;
        }

        .status.ready {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        button {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .connect-btn {
            background: #28a745;
            color: white;
        }
        
        .connect-btn:hover {
            background: #218838;
        }
        
        .disconnect-btn {
            background: #dc3545;
            color: white;
        }
        
        .disconnect-btn:hover {
            background: #c82333;
        }
        
        .send-btn {
            background: #007bff;
            color: white;
        }
        
        .send-btn:hover {
            background: #0056b3;
        }
        
        .clear-btn {
            background: #6c757d;
            color: white;
        }
        
        .clear-btn:hover {
            background: #545b62;
        }

        .copy-btn {
            background: #17a2b8;
            color: white;
            padding: 8px 16px;
            font-size: 14px;
        }

        .copy-btn:hover {
            background: #138496;
        }

        .copy-btn:active {
            background: #0f6674;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        
        input, textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s ease;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #007bff;
        }
        
        textarea {
            min-height: 60px;
            resize: vertical;
        }

        #systemPromptInput {
            min-height: 200px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .messages {
            border: 2px solid #ddd;
            border-radius: 8px;
            height: 400px;
            overflow-y: auto;
            padding: 15px;
            background: #f8f9fa;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            word-wrap: break-word;
        }
        
        .message.sent {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }
        
        .message.received {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }
        
        .message.system {
            background: #fff3e0;
            border-left: 4px solid #ff9800;
        }
        
        .message.error {
            background: #ffebee;
            border-left: 4px solid #f44336;
        }
        
        .timestamp {
            color: #666;
            font-size: 11px;
            margin-right: 10px;
        }
        
        .response-area {
            background: #e8f5e8;
            border: 2px solid #4caf50;
            border-radius: 8px;

        }

        .response-header {

            align-items: center;
            justify-content: space-between;

        }

        .response-title {
            font-weight: bold;
        }

        .response-content {
            white-space: pre-wrap;
        }
        
        .response-area.empty {
            background: #f5f5f5;
            border-color: #ddd;
            color: #999;
        }
        
        .session-info {
            background: #e1f5fe;
            border: 1px solid #b3e5fc;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .response-history {
            margin-top: 15px;
            margin-bottom: 30px;
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9fa;
        }

        .response-history-item {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 12px;
            margin-bottom: 10px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .history-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 6px;
            gap: 8px;
        }

        .history-header .timestamp {
            margin-bottom: 0;
        }

        .response-history-item.user {
            background: #e3f2fd;
            border-left: 4px solid #2196f3;
        }

        .response-history-item.assistant {
            background: #f3e5f5;
            border-left: 4px solid #9c27b0;
        }

        .response-history-item:last-child {
            margin-bottom: 0;
        }

        .response-history-item .timestamp {
            color: #666;
            font-size: 11px;
            margin-bottom: 8px;
            display: block;
            font-weight: bold;
        }

        .response-history-item .content {
            color: #333;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .response-history.empty {
            background: #f5f5f5;
            color: #999;
            text-align: left;
            padding: 20px;
        }

        /* .step-badge {
            display: inline-block;
            margin-left: 8px;
            padding: 2px 8px;
            border-radius: 999px;
            background: #fff3cd;
            color: #856404;
            border: 1px solid #ffeeba;
            font-size: 11px;
            font-weight: bold;
        }

        .step-badge.hidden {
            display: none;
        } */

        .auth-box {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
    </style>
    <!-- Google 로그인 팝업이 이 페이지로 돌아오면 ID 토큰을 원래 창에 넘기고 닫는다.
         구글 로그인 페이지를 거치면 window.opener가 끊길 수 있어 같은 출처 BroadcastChannel로 전달한다. -->
    <script>
        (function () {
            var hash = location.hash.slice(1);
            // 우리가 연 로그인 팝업의 응답만 처리한다: state(32자리 hex) + id_token 또는 error
            if (!/(^|&)state=[0-9a-f]{32}(&|$)/.test(hash) || !/(^|&)(id_token|error)=/.test(hash)) return;
            // ID 토큰이 방문 기록·주소창에 남지 않도록 해시를 지운다
            history.replaceState(null, '', location.pathname + location.search);
            try {
                var channel = new BroadcastChannel('deepme-google-login');
                channel.postMessage({ hash: hash });
                channel.close();
            } catch (e) {}
            // 대체 경로: opener 연결이 남아 있으면 같은 출처로만 전달 (중복 수신은 state 검증에서 무시된다)
            try {
                if (window.opener) {
                    window.opener.postMessage({ type: 'deepme-google-login', hash: hash }, location.origin);
                }
            } catch (e) {}
            window.close();
            // 창이 닫히지 않는 경우를 위한 안내. 팝업에서는 나머지 페이지를 실행하지 않는다.
            document.write('로그인 완료 – 이 창을 닫고 원래 창으로 돌아가세요.');
            window.stop();
        })();
    </script>
</head>
<body>
<div class="container">
    <h1>🚀 Deep_me 감정대화 테스트</h1>

    <div id="status" class="status disconnected">연결되지 않음</div>

    <div class="session-info" id="sessionInfo" style="display: none;">
        <strong>세션 ID:</strong> <span id="sessionId">-</span>
    </div>

    <div class="auth-box">
        <div id="authInfo" style="display: none;">
            로그인: <strong id="authEmail"></strong>
            <button id="logoutBtn" class="clear-btn">로그아웃</button>
        </div>
    </div>

    <div class="controls">
        <button id="connectBtn" class="connect-btn">연결</button>
        <button id="disconnectBtn" class="disconnect-btn" disabled>연결 끊기</button>
        <button id="clearBtn" class="clear-btn">로그 지우기</button>
    </div>

    <div class="input-group">
        <label for="messageInput">메시지 (Enter로 전송):</label>
        <textarea id="messageInput" placeholder="전송할 메시지를 입력하세요 (Enter: 전송, Shift+Enter: 줄바꿈)"></textarea>
        <button id="sendBtn" class="send-btn" disabled style="display: none;">전송</button>
    </div>

    <h3>실시간 응답:</h3>
    <div id="responseArea" class="response-area empty">
        <div class="response-header">
            <strong class="response-title">실시간 응답</strong>
            <!-- <span id="responseStepBadge" class="step-badge hidden"></span> -->
        </div>
        <div class="response-content">여기에 실시간 응답이 표시됩니다...</div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px;">
        <h3 style="margin: 0;">전체 대화 히스토리:</h3>
        <button id="copyHistoryBtn" class="copy-btn" title="전체 히스토리 복사">📋 전체 복사</button>
    </div>
    <div id="responseHistory" class="response-history empty">아직 완료된 응답이 없습니다.</div>

    <div class="input-group">
        <label for="systemPromptInput">시스템 프롬프트 (테스트 서버에 저장 · 저장하면 모든 테스터의 다음 메시지부터 적용):</label>
        <div id="promptSource" style="font-size: 12px; color: #666; margin-bottom: 6px;">아직 불러오지 않았습니다.</div>
        <textarea id="systemPromptInput" autocomplete="off" placeholder="페이지를 열면 서버에서 자동으로 불러옵니다..."></textarea>
        <div style="margin-top: 10px;">
            <button id="loadPromptBtn" class="copy-btn">현재 프롬프트 불러오기</button>
            <button id="savePromptBtn" class="send-btn">프롬프트 저장</button>
            <button id="resetPromptBtn" class="clear-btn">기본값으로 되돌리기</button>
        </div>
    </div>

    <h3>로그:</h3>
    <div id="messages" class="messages"></div>
</div>

<script>
    let ws = null;
    let currentResponse = '';
    // let currentStep = { step: null, step_name: null };
    // let currentResponseStep = { step: null, step_name: null };
    let isResponding = false;
    // 지금 받는 응답이 연결 직후 인사말인지 (히스토리에 표시)
    let currentResponseIsGreeting = false;
    let lastAssistantHistoryEl = null;
    let lastAssistantHistoryTs = 0;
    // const defaultUserStep = { step: 1, step_name: '인사' };

    const statusEl = document.getElementById('status');
    const sessionInfoEl = document.getElementById('sessionInfo');
    const sessionIdEl = document.getElementById('sessionId');
    const connectBtn = document.getElementById('connectBtn');
    const disconnectBtn = document.getElementById('disconnectBtn');
    const sendBtn = document.getElementById('sendBtn');
    const clearBtn = document.getElementById('clearBtn');
    const savePromptBtn = document.getElementById('savePromptBtn');
    const loadPromptBtn = document.getElementById('loadPromptBtn');
    const resetPromptBtn = document.getElementById('resetPromptBtn');
    const promptSourceEl = document.getElementById('promptSource');
    const copyHistoryBtn = document.getElementById('copyHistoryBtn');
    const messagesEl = document.getElementById('messages');
    const responseAreaEl = document.getElementById('responseArea');
    const responseHistoryEl = document.getElementById('responseHistory');
    // const responseStepBadgeEl = document.getElementById('responseStepBadge');
    const messageInput = document.getElementById('messageInput');
    const systemPromptInput = document.getElementById('systemPromptInput');

    function addMessage(content, type = 'system') {
        const messageEl = document.createElement('div');
        messageEl.className = `message ${type}`;

        const timestampEl = document.createElement('span');
        timestampEl.className = 'timestamp';
        timestampEl.textContent = `[${new Date().toLocaleTimeString()}]`;
        // URL 해시·서버 응답에서 온 문자열도 들어오므로 HTML로 해석하지 않는다
        messageEl.append(timestampEl, String(content));

        messagesEl.appendChild(messageEl);
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function updateStatus(status, className) {
        statusEl.textContent = status;
        statusEl.className = `status ${className}`;
    }

    // ===== 서버 워밍업 =====
    // Render 무료 플랜은 유휴 15분이면 잠들고, 다시 뜨는 데 수십 초가 걸린다.
    // 웹소켓 연결 전에 /health로 먼저 깨워, 그동안 상태 표시줄에 경과 시간을 보여 준다.
    const SERVER_HOST = 'deep-me-test-server.onrender.com';
    const WARMUP_TIMEOUT_MS = 90 * 1000;
    // 서버가 다시 잠드는 시간(15분)보다 짧게 잡는다.
    const WARM_TTL_MS = 10 * 60 * 1000;

    let warmupPromise = null;
    let warmAt = 0;

    function isWsOpen() {
        return ws && ws.readyState === WebSocket.OPEN;
    }

    // 결과: 'warm'(HTTP 응답 옴, 상태 코드 무관) | 'booting'(대기 시간 초과 – 기동이 길거나 서버 이상)
    //       | 'unreachable'(요청 실패 – 네트워크·차단 확장 프로그램·연결 리셋 등)
    // 진행 중이면 같은 대기를 공유하고, 최근에 깨운 적이 있으면 바로 'warm'을 준다.
    function warmUpServer() {
        if (warmupPromise) return warmupPromise;
        if (warmAt && Date.now() - warmAt < WARM_TTL_MS) return Promise.resolve('warm');

        const startedAt = Date.now();
        const showElapsed = () => {
            if (isWsOpen()) return;
            const sec = Math.floor((Date.now() - startedAt) / 1000);
            updateStatus(`서버 깨우는 중… ${sec}초 (보통 1분 이내, 최대 ${WARMUP_TIMEOUT_MS / 1000}초)`, 'connecting');
        };
        showElapsed();
        const ticker = setInterval(showElapsed, 1000);

        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), WARMUP_TIMEOUT_MS);

        // 페이지 출처가 서버 CORS 허용 목록에 없어도 깨울 수 있도록 no-cors로 보낸다. 응답이 opaque라 상태 코드·본문을
        // 볼 수 없고 "어떤 HTTP 응답이든 왔다"만 안다(5xx도 'warm'으로 본다). Render는 콜드 스타트 동안
        // 요청을 붙잡아 두므로 대개 기동 완료를 뜻하며, 오판한 경우는 ws.onclose에서 warmAt을 초기화한다.
        let failure = null;
        warmupPromise = fetch(`https://${SERVER_HOST}/health`, {
            mode: 'no-cors',
            cache: 'no-store',
            signal: controller.signal,
        })
            .then(() => 'warm')
            .catch((error) => {
                failure = error;
                console.error('[warmup] /health 요청 실패', error);
                return error.name === 'AbortError' ? 'booting' : 'unreachable';
            })
            .then((outcome) => {
                clearInterval(ticker);
                clearTimeout(timeout);
                warmupPromise = null;
                const sec = Math.floor((Date.now() - startedAt) / 1000);
                warmAt = outcome === 'warm' ? Date.now() : 0;

                if (!isWsOpen()) {
                    if (outcome === 'warm') {
                        updateStatus(readyStatusText(), 'ready');
                    } else if (outcome === 'booting') {
                        updateStatus('서버 응답 없음 – 연결 버튼으로 다시 시도', 'disconnected');
                    } else {
                        updateStatus('서버 요청 실패 – 연결 버튼으로 다시 시도', 'disconnected');
                    }
                }
                if (outcome === 'warm') {
                    addMessage(`🔥 서버 준비됨 (${sec}초)`, 'system');
                } else if (outcome === 'booting') {
                    addMessage(`⚠️ 서버가 ${WARMUP_TIMEOUT_MS / 1000}초 안에 응답하지 않았습니다.`, 'error');
                } else {
                    addMessage(`⚠️ 서버 요청 실패 (${failure.name}: ${failure.message}). 네트워크·차단 확장 프로그램을 확인하거나 잠시 후 다시 시도하세요.`, 'error');
                }
                return outcome;
            });

        return warmupPromise;
    }

    function readyStatusText() {
        return hasValidAuth()
            ? "서버 준비됨 · 아직 연결 전 – '연결' 버튼을 눌러 대화를 시작하세요"
            : "서버 준비됨 · '연결' 버튼을 누르면 Google 로그인 후 바로 연결됩니다";
    }

    // ===== Google 로그인 =====
    // 연결 버튼 → Google 로그인 팝업(ID 토큰) → POST /auth/google → 서버 access_token → 웹소켓 ?access_token= 로 인증한다.
    // 서버 GOOGLE_CLIENT_ID(deepme-google-OAuth-backend)와 같아야 서버의 aud 검증을 통과한다.
    // 팝업 리디렉트 주소(이 페이지의 index.html)는 그 클라이언트의 '승인된 리디렉션 URI'에 등록돼 있어야 한다.
    const GOOGLE_CLIENT_ID = '209810417495-mj3epoa67n1g9qcf061qg7o13919h3cl.apps.googleusercontent.com';
    const LOGIN_CHANNEL = 'deepme-google-login';
    // 탭을 닫으면 사라지도록 sessionStorage에 둔다 (새로고침해도 다시 로그인할 필요는 없음)
    const AUTH_STORAGE_KEY = 'deepme_auth';

    const authInfoEl = document.getElementById('authInfo');
    const authEmailEl = document.getElementById('authEmail');
    const logoutBtn = document.getElementById('logoutBtn');

    let auth = loadAuth(); // { accessToken, email, expiresAt }
    // 진행 중인 팝업 로그인의 검증 값. 응답의 state·nonce가 이것과 같아야 받아들인다.
    let pendingLogin = null; // { state, nonce }

    function loadAuth() {
        try {
            const raw = sessionStorage.getItem(AUTH_STORAGE_KEY);
            if (!raw) return null;
            const saved = JSON.parse(raw);
            return saved && saved.expiresAt > Date.now() ? saved : null;
        } catch (e) {
            return null;
        }
    }

    function saveAuth(value) {
        try {
            if (value) sessionStorage.setItem(AUTH_STORAGE_KEY, JSON.stringify(value));
            else sessionStorage.removeItem(AUTH_STORAGE_KEY);
        } catch (e) {}
    }

    function hasValidAuth() {
        return !!auth && auth.expiresAt > Date.now();
    }

    function clearAuth() {
        auth = null;
        saveAuth(null);
        renderAuth();
    }

    function renderAuth() {
        const loggedIn = hasValidAuth();
        authInfoEl.style.display = loggedIn ? 'block' : 'none';
        authEmailEl.textContent = loggedIn ? auth.email : '';
    }

    // JWT 본문(payload)을 읽는다. 서명 검증은 서버가 한다. 실패하면 null.
    function jwtPayload(token) {
        try {
            const body = token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
            return JSON.parse(atob(body));
        } catch (e) {
            return null;
        }
    }

    function jwtExpiresAt(token) {
        const payload = jwtPayload(token);
        return payload && typeof payload.exp === 'number' ? payload.exp * 1000 : null;
    }

    function randomString() {
        const bytes = new Uint8Array(16);
        crypto.getRandomValues(bytes);
        return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('');
    }

    // 로컬은 http://localhost:5173/index.html, GitHub Pages는 .../deepme-chat-test/index.html
    function loginRedirectUri() {
        return location.origin + location.pathname.replace(/[^/]*$/, '') + 'index.html';
    }

    // 클릭 핸들러 안에서 바로 열어야 브라우저 팝업 차단에 걸리지 않는다
    function openGoogleLoginPopup() {
        pendingLogin = { state: randomString(), nonce: randomString() };
        const params = new URLSearchParams({
            client_id: GOOGLE_CLIENT_ID,
            redirect_uri: loginRedirectUri(),
            response_type: 'id_token',
            scope: 'openid email profile',
            state: pendingLogin.state,
            nonce: pendingLogin.nonce,
            prompt: 'select_account',
        });
        const popup = window.open(
            `https://accounts.google.com/o/oauth2/v2/auth?${params}`,
            'deepme-google-login',
            'width=500,height=650'
        );
        if (!popup) {
            pendingLogin = null;
            updateStatus('팝업이 차단됨 – 팝업을 허용한 뒤 연결 버튼을 다시 눌러 주세요', 'disconnected');
            addMessage('❌ 브라우저가 로그인 팝업을 차단했습니다. 이 사이트의 팝업을 허용해 주세요.', 'error');
            return;
        }
        updateStatus("Google 로그인 창에서 계정을 선택해 주세요 (창을 닫았다면 '연결'을 다시 누르세요)", 'connecting');
        // redirect_uri_mismatch가 나면 이 값이 구글 콘솔의 '승인된 리디렉션 URI'와 정확히 같은지 비교한다
        addMessage(`🔐 Google 로그인 창을 열었습니다. (리디렉트 주소: ${loginRedirectUri()})`, 'system');
    }

    // 팝업이 돌려준 리디렉트 해시(#id_token=...&state=...)를 검증한다
    function handleLoginRedirect(hash) {
        if (!pendingLogin || typeof hash !== 'string') return;
        const params = new URLSearchParams(hash);
        // 다른 탭이 연 로그인의 응답일 수 있다 — 내 요청이 아니면 무시
        if (params.get('state') !== pendingLogin.state) return;
        const expectedNonce = pendingLogin.nonce;
        pendingLogin = null;

        if (params.get('error')) {
            addMessage(`❌ Google 로그인 실패: ${params.get('error')}`, 'error');
            updateStatus(readyStatusText(), 'ready');
            return;
        }
        const idToken = params.get('id_token');
        const payload = idToken && jwtPayload(idToken);
        if (!payload || payload.nonce !== expectedNonce) {
            addMessage('❌ 로그인 응답 검증 실패(nonce 불일치). 연결 버튼을 다시 눌러 주세요.', 'error');
            updateStatus(readyStatusText(), 'ready');
            return;
        }
        handleGoogleCredential(idToken);
    }

    try {
        const loginChannel = new BroadcastChannel(LOGIN_CHANNEL);
        loginChannel.onmessage = (event) => handleLoginRedirect(event.data && event.data.hash);
    } catch (e) {
        console.error('[auth] BroadcastChannel을 쓸 수 없습니다 – 팝업의 postMessage로만 받습니다', e);
    }
    window.addEventListener('message', (event) => {
        if (event.origin !== location.origin) return;
        if (event.data && event.data.type === 'deepme-google-login') handleLoginRedirect(event.data.hash);
    });

    async function handleGoogleCredential(idToken) {
        // 서버 토큰을 받는 동안 다시 눌러 두 번째 로그인을 시작하지 않도록 막는다
        connectBtn.disabled = true;
        addMessage('🔐 Google 로그인 완료 – 서버 토큰 발급 중...', 'system');

        const outcome = await warmUpServer();
        if (outcome !== 'warm') {
            connectBtn.disabled = false;
            addMessage('❌ 서버가 준비되지 않아 로그인을 마치지 못했습니다. 다시 로그인해 주세요.', 'error');
            return;
        }

        try {
            const res = await fetch(`https://${SERVER_HOST}/auth/google`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id_token: idToken }),
            });
            if (!res.ok) {
                const detail = await res.text();
                throw new Error(`HTTP ${res.status} ${detail}`);
            }
            const data = await res.json();
            auth = {
                accessToken: data.access_token,
                email: (data.user && data.user.email) || '',
                expiresAt: jwtExpiresAt(data.access_token) || Date.now() + data.expires_in * 1000,
            };
            saveAuth(auth);
            addMessage(`✅ 서버 로그인 성공: ${auth.email} (만료 ${new Date(auth.expiresAt).toLocaleTimeString('ko-KR')})`, 'system');
            renderAuth();
            // 로그인되면 바로 연결한다 (connect가 버튼 상태를 이어받는다)
            connect();
        } catch (error) {
            // CORS 차단이면 브라우저는 'Failed to fetch'만 알려 준다
            console.error('[auth] /auth/google 실패', error);
            addMessage(`❌ 서버 로그인 실패: ${error.message}`, 'error');
            updateStatus(readyStatusText(), 'ready');
            connectBtn.disabled = false;
        }
    }

    logoutBtn.addEventListener('click', () => {
        if (ws) ws.close();
        clearAuth();
        addMessage('👋 로그아웃했습니다.', 'system');
        updateStatus(readyStatusText(), 'ready');
    });

    renderAuth();

    function updateResponse(text, isComplete = false) {
        const contentEl = responseAreaEl.querySelector('.response-content');
        if (isComplete) {
            responseAreaEl.className = 'response-area';
            contentEl.textContent = text;
        } else {
            responseAreaEl.className = 'response-area';
            // AI 응답은 텍스트로만 넣고, 깜박이는 커서만 요소로 붙인다
            const cursorEl = document.createElement('span');
            cursorEl.style.animation = 'blink 1s infinite';
            cursorEl.textContent = '|';
            contentEl.replaceChildren(String(text), cursorEl);
        }
    }

    function clearResponse() {
        responseAreaEl.className = 'response-area empty';
        const contentEl = responseAreaEl.querySelector('.response-content');
        if (contentEl) {
            contentEl.textContent = '여기에 실시간 응답이 표시됩니다...';
        } else {
            responseAreaEl.textContent = '여기에 실시간 응답이 표시됩니다...';
        }
    }

    function addToHistory(text, type = 'assistant', stepInfo = null, note = '') {
        // 히스토리가 비어있으면 empty 클래스 제거
        if (responseHistoryEl.classList.contains('empty')) {

        // const hasStep = (stepInfo && (stepInfo.step !== null || stepInfo.step_name)) || (currentStep.step !== null || currentStep.step_name);
        // const effectiveStep = hasStep ? (stepInfo || currentStep) : (type === 'user' ? defaultUserStep : null);
        // const stepLabel = formatStepBadge(effectiveStep);

        // 사용자 입력·AI 응답은 HTML로 해석하지 않고 텍스트로만 넣는다
        const headerEl = document.createElement('div');
        headerEl.className = 'history-header';
        const timestampEl = document.createElement('span');
        timestampEl.className = 'timestamp';
        timestampEl.textContent = `[${timestamp}] ${label}`;
        headerEl.append(timestampEl);

        responseHistoryEl.insertBefore(historyItem, responseHistoryEl.firstChild);

        responseHistoryEl.scrollTop = 0;

        if (type === 'assistant') {

    function clearHistory() {
        responseHistoryEl.className = 'response-history empty';
        responseHistoryEl.textContent = '아직 완료된 응답이 없습니다.';
    }

    // ===== 시스템 프롬프트 (/prompts API) =====
    // 테스트 서버에서만 열리는 API로, 저장하면 서버 DB에 이력으로 쌓이고 모든 테스터의 다음 메시지부터(진행 중인 대화 포함) 적용된다.
    // 운영 서버에서는 404이고, 저장값을 읽지 않는다.
    const PROMPT_API_URL = `https://${SERVER_HOST}/prompts/system`;
    const PROMPT_ERROR_TEXT = {
        content_empty: '프롬프트가 비어 있습니다.',
        content_too_large: '프롬프트가 너무 깁니다 (최대 50KB).',
    };
    // 서버가 잠들어 있으면 깨어날 때까지 요청이 붙잡히므로 워밍업 대기와 같은 시간을 준다.
    const PROMPT_REQUEST_TIMEOUT_MS = WARMUP_TIMEOUT_MS;
    const PROMPT_UNCERTAIN_HINT = "서버에는 반영됐을 수 있으니 '현재 프롬프트 불러오기'로 확인하세요.";
    const promptButtons = [loadPromptBtn, savePromptBtn, resetPromptBtn];

    // 마지막으로 서버와 맞춘 내용. null이면 아직 서버 값을 한 번도 확인하지 못한 상태다.
    let lastSyncedPrompt = null;
    let lastSyncedAt = null;
    // 프롬프트 요청은 한 번에 하나만 보낸다 (자동 불러오기와 버튼 요청이 겹쳐 화면이 엇갈리지 않도록).
    let promptBusy = false;
    // 작성 중이라 자동 불러오기를 건너뛴 사실을 로그에 이미 남겼는지 (연결할 때마다 반복하지 않도록)
    let autoLoadSkipNotified = false;

    // uncertain: PUT/DELETE가 서버에 반영됐는지 알 수 없는 실패 (시간 초과·네트워크/CORS 실패·5xx·응답 형식 이상). GET은 항상 false.
    class PromptRequestError extends Error {
        constructor(message, { uncertain = false } = {}) {
            super(message);
            this.uncertain = uncertain;
        }
    }

    function describeErrorDetail(detail) {
        if (typeof detail === 'string') return detail;
        // FastAPI 422 검증 오류는 [{loc, msg, type}] 배열로 온다
        if (Array.isArray(detail)) {
            return detail.map((d) => `${(d.loc || []).join('.')}: ${d.msg}`).join('; ');
        }
        return '';
    }

    function isPromptResponse(data) {
        return Boolean(data) && typeof data.content === 'string' && typeof data.sha256 === 'string';
    }

    async function requestPrompt(method, body) {
        const mayHaveApplied = method !== 'GET';
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), PROMPT_REQUEST_TIMEOUT_MS);
        let response;
        try {
            response = await fetch(PROMPT_API_URL, {
                method,
                cache: 'no-store',
                headers: body ? { 'Content-Type': 'application/json' } : undefined,
                body: body ? JSON.stringify(body) : undefined,
                signal: controller.signal,
            });
        } catch (error) {
            if (error.name === 'AbortError') {
                console.error(`[prompt] ${method} 요청 시간 초과`, error);
                throw new PromptRequestError(
                    `서버가 ${PROMPT_REQUEST_TIMEOUT_MS / 1000}초 안에 응답하지 않았습니다. 잠시 후 다시 시도하세요.`,
                    { uncertain: mayHaveApplied },
                );
            }
            // 네트워크 오류·CORS 차단은 물론, CORS 헤더 없이 오는 서버 500도 브라우저에서는 이렇게 보인다.
            console.error(`[prompt] ${method} 요청 실패`, error);
            throw new PromptRequestError(
                `서버에 요청하지 못했습니다 (네트워크 오류 또는 CORS 차단 – 현재 출처 ${location.origin}. 서버 내부 오류(500)도 이렇게 보일 수 있습니다)`,
                { uncertain: mayHaveApplied },
            );
        } finally {
            clearTimeout(timeout);
        }

        const data = await response.json().catch((error) => {
            console.error(`[prompt] ${method} 응답 본문 해석 실패 (HTTP ${response.status})`, error);
            return null;
        });

        if (!response.ok) {
            const detail = describeErrorDetail(data?.detail);
            if (response.status === 404) {
                throw new PromptRequestError('프롬프트 API를 찾을 수 없습니다 (404). 테스트 서버에 /prompts가 배포됐는지, 서버가 테스트 서버로 인식되는지 확인하세요.');
            }
            if (response.status === 429) {
                throw new PromptRequestError('요청이 너무 많습니다. 잠시 후 다시 시도하세요 (분당 20회, 테스터 전체가 함께 쓰는 한도일 수 있음).');
            }
            if (response.status >= 500) {
                throw new PromptRequestError(`서버 오류 (HTTP ${response.status}). 서버가 재시작·배포 중일 수 있으니 잠시 후 다시 시도하세요.`, { uncertain: mayHaveApplied });
            }
            throw new PromptRequestError(PROMPT_ERROR_TEXT[detail] || `HTTP ${response.status}${detail ? ` (${detail})` : ''}`);
        }

        if (!isPromptResponse(data)) {
            console.error(`[prompt] ${method} 응답 형식 오류`, data);
            throw new PromptRequestError(`서버 응답 형식이 올바르지 않습니다 (HTTP ${response.status}).`, { uncertain: mayHaveApplied });
        }
        return data;
    }

    function describePromptSource(data) {
        const sha = `SHA256 ${data.sha256.substring(0, 12)}…`;
        if (data.source === 'db') {
            const savedAt = data.updated_at ? new Date(data.updated_at) : new Date(NaN);
            const when = Number.isNaN(savedAt.getTime()) ? '저장 시각 알 수 없음' : `${savedAt.toLocaleString('ko-KR')} 저장`;
            return `저장된 프롬프트 · ${when} · ${sha}`;
        }
        if (data.source === 'file') return `기본 파일 프롬프트 · ${sha}`;
        return `출처 알 수 없음(${data.source}) · ${sha}`;
    }

    // 검증을 마친 응답만 받아 입력란·기준값·상태 표시를 한꺼번에 바꾼다.
    function applyPromptResponse(data) {
        const sourceText = describePromptSource(data);
        systemPromptInput.value = data.content;
        lastSyncedPrompt = data.content;
        lastSyncedAt = new Date();
        promptSourceEl.textContent = `현재 적용 중: ${sourceText}`;
        return sourceText;
    }

    function hasUnsavedPromptEdit() {
        // 서버 값을 확인한 적이 없으면 입력란에 쓴 내용은 모두 수정으로 본다
        return systemPromptInput.value.trim() !== (lastSyncedPrompt ?? '').trim();
    }

    function lastSyncedNote() {
        if (hasUnsavedPromptEdit()) return ' · 입력란에는 저장하지 않은 수정 내용이 남아 있습니다';
        return lastSyncedAt
            ? ` · 입력란은 ${lastSyncedAt.toLocaleTimeString('ko-KR')}에 마지막으로 확인한 값입니다`
            : '';
    }

    // 다른 요청이 진행 중이면 실행하지 않고 false를 돌려준다.
    async function runPromptAction(activeBtn, busyText, action) {
        if (promptBusy) return false;
        promptBusy = true;
        const originalText = activeBtn.textContent;
        promptButtons.forEach((btn) => { btn.disabled = true; });
        // 응답이 오면 입력란을 서버 값으로 바꾸므로, 그사이 입력한 내용이 사라지지 않게 막아 둔다
        systemPromptInput.readOnly = true;
        activeBtn.textContent = busyText;
        try {
            await action();
        } finally {
            promptBusy = false;
            promptButtons.forEach((btn) => { btn.disabled = false; });
            systemPromptInput.readOnly = false;
            activeBtn.textContent = originalText;
        }
        return true;
    }

    function reportUncertainFailure(label, error) {
        addMessage(`❌ ${label} 실패: ${error.message} ${PROMPT_UNCERTAIN_HINT}`, 'error');
        promptSourceEl.textContent = `⚠️ ${label} 결과를 알 수 없습니다 – '현재 프롬프트 불러오기'로 확인하세요.`;
    }

    async function loadSystemPrompt({ confirmOverwrite = true } = {}) {
        if (confirmOverwrite && hasUnsavedPromptEdit()
            && !confirm('저장하지 않은 수정 내용이 있습니다. 서버의 현재 프롬프트로 덮어쓸까요?')) {
            return;
        }
        await runPromptAction(loadPromptBtn, '불러오는 중...', async () => {
            try {
                const sourceText = applyPromptResponse(await requestPrompt('GET'));
                addMessage(`📥 시스템 프롬프트를 불러왔습니다 · ${sourceText}`, 'system');
            } catch (error) {
                promptSourceEl.textContent = `불러오기 실패: ${error.message}${lastSyncedNote()}`;
                addMessage(`❌ 시스템 프롬프트 불러오기 실패: ${error.message}`, 'error');
            }
        });
    }

    // 워밍업이 'warm'으로 끝났을 때(페이지 로드 직후, 연결 버튼 처리 중) 아직 서버 값을 확인하지 못했으면 한 번 불러온다.
    // 입력란에 작성 중인 내용이 있으면 덮어쓰지 않고 안내만 한다.
    function autoLoadSystemPrompt() {
        if (lastSyncedPrompt !== null || promptBusy) return;
        if (hasUnsavedPromptEdit()) {
            promptSourceEl.textContent = "입력란에 작성 중인 내용이 있어 자동으로 불러오지 않았습니다. '현재 프롬프트 불러오기'로 서버 값을 확인하세요.";
            if (!autoLoadSkipNotified) {
                addMessage('ℹ️ 작성 중인 프롬프트가 있어 서버 프롬프트를 자동으로 불러오지 않았습니다.', 'system');
                autoLoadSkipNotified = true;
            }
            return;
        }
        loadSystemPrompt({ confirmOverwrite: false });
    }

    async function saveSystemPrompt() {
        const content = systemPromptInput.value.trim();
        if (!content) {
            addMessage('⚠️ 시스템 프롬프트가 비어있습니다. 내용을 입력해주세요.', 'error');
            return;
        }
        if (lastSyncedPrompt === null
            && !confirm('서버의 현재 프롬프트를 아직 확인하지 않았습니다. 다른 테스터가 저장한 프롬프트를 덮어쓸 수 있습니다. 그래도 저장할까요?')) {
            return;
        }
        // 바뀐 내용 없이 저장하면 같은 내용의 저장값이 하나 더 생긴다. 서버는 저장값을 기본 파일보다 우선하므로,
        // 기본 파일이 적용된 상태에서 이렇게 저장하면 이후 파일을 고쳐 배포해도 테스트 서버에 반영되지 않는다.
        if (lastSyncedPrompt !== null && !hasUnsavedPromptEdit()
            && !confirm('서버에 적용 중인 프롬프트와 내용이 같습니다. 그래도 저장할까요?')) {
            return;
        }
        await runPromptAction(savePromptBtn, '저장 중...', async () => {
            try {
                addMessage('💾 시스템 프롬프트를 서버에 저장하는 중...', 'system');
                const data = await requestPrompt('PUT', { content });
                applyPromptResponse(data);
                addMessage(`✅ 시스템 프롬프트 저장 완료 (SHA256 ${data.sha256.substring(0, 16)}…). 모든 테스터의 다음 메시지부터 적용됩니다 (진행 중인 대화 포함).`, 'system');
            } catch (error) {
                if (error.uncertain) {
                    reportUncertainFailure('시스템 프롬프트 저장', error);
                } else {
                    addMessage(`❌ 시스템 프롬프트 저장 실패: ${error.message}`, 'error');
                }
            }
        });
    }

    async function resetSystemPrompt() {
        const draftWarning = hasUnsavedPromptEdit() ? '\n입력란의 저장하지 않은 수정 내용도 사라집니다.' : '';
        if (!confirm(`저장된 프롬프트 적용을 해제하고 기본 파일 프롬프트로 되돌릴까요? (저장 이력은 서버에 남습니다)\n모든 테스터에게 적용됩니다.${draftWarning}`)) {
            return;
        }
        await runPromptAction(resetPromptBtn, '되돌리는 중...', async () => {
            try {
                applyPromptResponse(await requestPrompt('DELETE'));
                addMessage('↩️ 저장된 프롬프트 적용을 해제하고 기본 파일 프롬프트로 되돌렸습니다. 모든 테스터의 다음 메시지부터 적용됩니다 (진행 중인 대화 포함).', 'system');
            } catch (error) {
                if (error.uncertain) {
                    reportUncertainFailure('기본값 되돌리기', error);
                } else {
                    addMessage(`❌ 기본값 되돌리기 실패: ${error.message}`, 'error');
                }
            }
        });
    }

    connectBtn.addEventListener('click', () => {
        // 서버가 토큰 없는 접속을 거부한다. 로그인 전이면 Google 로그인 팝업을 띄우고, 로그인되면 자동 연결한다.
        if (hasValidAuth()) {
            connect();
        } else {
            clearAuth();
            openGoogleLoginPopup();
        }
    });

    // connect()가 워밍업 대기부터 소켓 open/close까지 진행 중인지
    let connecting = false;
    // 토큰이 아직 유효한데 소켓이 열리지 못하고 연속으로 닫힌 횟수.
    // 서버가 토큰을 거부하는 경우(재배포로 서명 키 변경 등) 브라우저에는 1006만 보이므로 이 횟수로 판단한다.
    let failedOpensWithAuth = 0;
    const MAX_FAILED_OPENS_WITH_AUTH = 2;

    function finishConnecting() {
        connecting = false;
        connectBtn.disabled = false;
    }

    async function connect() {
        // 로그인 완료와 클릭이 겹쳐도 소켓을 두 개 만들지 않는다
        if (connecting || (ws && ws.readyState <= WebSocket.OPEN)) return;
        connecting = true;
        connectBtn.disabled = true;

        // 서버가 잠들어 있으면 깨운 뒤에 연결한다
        const outcome = await warmUpServer();
        if (outcome !== 'warm') {
            finishConnecting();
            return;
        }
        // 아직 서버 프롬프트를 받지 못했으면(첫 워밍업·첫 불러오기 실패 등) 서버가 깨어난 지금 다시 시도한다 (프롬프트 API는 로그인과 무관)
        autoLoadSystemPrompt();

        // 대기하는 동안 로그아웃했거나 토큰이 만료됐을 수 있다
        if (!hasValidAuth()) {
            finishConnecting();
            clearAuth();
            updateStatus(readyStatusText(), 'ready');
            addMessage("🔑 로그인 정보가 없어 연결을 멈췄습니다. '연결' 버튼을 다시 눌러 주세요.", 'error');
            return;
        }

        updateStatus('연결 중...', 'connecting');
        addMessage(`WebSocket 연결을 시도합니다... (로그인: ${auth.email})`, 'system');

        try {
            // 테스트 서버 연결. 브라우저 WebSocket은 Authorization 헤더를 못 붙이므로 쿼리로 토큰을 보낸다
            const baseUrl = `wss://${SERVER_HOST}/ws/emotion`;
            const wsUrl = `${baseUrl}?access_token=${encodeURIComponent(auth.accessToken)}`;
            addMessage(`연결 URL: ${baseUrl}?access_token=***`, 'system');

            ws = new WebSocket(wsUrl);
            let opened = false;

            ws.onopen = () => {
                opened = true;
                connecting = false;
                failedOpensWithAuth = 0;
                updateStatus('연결됨', 'connected');
                addMessage('✅ WebSocket 연결 성공!', 'system');
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                sendBtn.disabled = false;
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    addMessage(`수신: ${JSON.stringify(data, null, 2)}`, 'received');

                    if (data.session_id) {
                        sessionIdEl.textContent = data.session_id;
                        sessionInfoEl.style.display = 'block';
                        addMessage(`🆔 세션 ID: ${data.session_id}`, 'system');

                    } else if (data.type === 'welcome') {
                        addMessage(`👋 웰컴 메시지: ${data.message}`, 'system');

                    /*
                    } else if (data.type === 'step') {
                        updateCurrentStep(data.step, data.step_name);
                        if (isResponding) {
                            currentResponseStep = { ...currentStep };
                        } else if (lastAssistantHistoryEl && Date.now() - lastAssistantHistoryTs < 5000) {
                            updateHistoryStepBadge(lastAssistantHistoryEl, currentStep);
                        }
                        addMessage(`🧭 현재 STEP: ${getStepText()}`, 'system');
                    */

                    } else if (data.type === 'message_start') {
                        // 메시지 시작
                        currentResponse = '';
                        currentResponseIsGreeting = false;
                        // currentResponseStep = { ...currentStep };
                        isResponding = true;
                        clearResponse();
                        addMessage(`📝 AI 응답 시작...`, 'system');

                    } else if (data.type === 'message' && data.message) {
                        // 스트리밍 조각이 아니라 완성된 문장 한 번에 오는 메시지 (연결 직후 서버 인사말)
                        isResponding = true;
                        currentResponse = data.message;
                        currentResponseIsGreeting = true;
                        updateResponse(currentResponse);

                    } else if (data.type === 'message_delta' && data.delta) {
                        // 실시간 토큰 스트리밍
                        if (!isResponding) {
                            isResponding = true;
                            // if (currentResponseStep.step === null && !currentResponseStep.step_name) {
                            //     currentResponseStep = { ...currentStep };
                            // }
                        }
                        currentResponse += data.delta;
                        updateResponse(currentResponse);

                    } else if (data.type === 'message_end') {
                        // 메시지 완료
                        updateResponse(currentResponse, true);
                        addMessage(`✅ 응답 완료!`, 'system');
                        isResponding = false;

                        // AI 응답을 히스토리에 추가
                        if (currentResponse) {
                            addToHistory(currentResponse, 'assistant', null, currentResponseIsGreeting ? '인사말' : '');
                        }
                        currentResponseIsGreeting = false;

                    } else if (data.type === 'error') {
                        addMessage(`❌ 오류: ${data.message}`, 'error');

                    } else if (data.error) {
                        addMessage(`❌ 오류: ${data.error}`, 'error');
                        if (data.traceback) {
                            addMessage(`스택 트레이스: ${data.traceback}`, 'error');
                        }
                    }

                } catch (e) {
                    addMessage(`JSON 파싱 오류: ${e.message}`, 'error');
                    addMessage(`원본 데이터: ${event.data}`, 'error');
                }
            };

            ws.onerror = (error) => {
                addMessage(`❌ WebSocket 오류: ${error}`, 'error');
            };

            ws.onclose = (event) => {
                connecting = false;
                if (opened) {
                    updateStatus('연결 끊김', 'disconnected');
                    addMessage(`🔌 연결 종료 (코드: ${event.code}, 이유: ${event.reason || '없음'})`, 'system');
                } else {
                    // 한 번도 열리지 못했다 — 워밍업 판정이 틀렸을 수 있으니 다음 시도에서 다시 깨운다
                    warmAt = 0;
                    updateStatus(`연결 실패 (코드 ${event.code}) – 연결 버튼으로 다시 시도`, 'disconnected');
                    addMessage(`❌ 연결 실패 (코드: ${event.code}, 이유: ${event.reason || '없음'})`, 'error');
                    if (event.code === 1006) {
                        // 브라우저는 핸드셰이크 거부(403 등)와 서버 중단을 모두 1006으로만 알려 준다
                        addMessage('ℹ️ 1006: 서버가 연결을 거부했거나(인증 거부 등) 응답 없이 끊었습니다.', 'error');
                    }
                    // 토큰이 만료됐으면 서버가 연결 전에 거부한다 — 다시 로그인하도록 안내
                    if (!hasValidAuth()) {
                        failedOpensWithAuth = 0;
                        clearAuth();
                        addMessage("🔑 로그인이 만료되었습니다. '연결' 버튼을 누르면 다시 로그인합니다.", 'error');
                    } else if (++failedOpensWithAuth >= MAX_FAILED_OPENS_WITH_AUTH) {
                        // 만료 전인데 계속 거부되면 서버가 토큰을 무효화했을 수 있다 — 새로 로그인하게 한다
                        failedOpensWithAuth = 0;
                        clearAuth();
                        addMessage("🔑 연결이 계속 거부됩니다. 로그인 정보를 지웠으니 '연결' 버튼을 눌러 다시 로그인해 주세요.", 'error');
                    }
                }
                connectBtn.disabled = false;
                disconnectBtn.disabled = true;
                sendBtn.disabled = true;
                sessionInfoEl.style.display = 'none';
                clearResponse();
                // updateCurrentStep(null, null);
            };

        } catch (error) {
            updateStatus('연결 실패', 'disconnected');
            addMessage(`❌ 연결 오류: ${error.message}`, 'error');
            finishConnecting();
        }
    }

    disconnectBtn.addEventListener('click', () => {
        if (ws) {
            ws.close();
            ws = null;
        }
    });

    function sendMessage() {
        if (!ws || ws.readyState !== WebSocket.OPEN) {
            addMessage('❌ WebSocket이 연결되지 않았습니다. 먼저 연결하세요.', 'error');
            return;
        }

        const message = messageInput.value.trim();
        if (!message) {
            addMessage('⚠️ 메시지를 입력해주세요.', 'system');
            return;
        }

        const payload = {
            user_input: message,
            step_type: 'normal'
        };

        // 서버는 클라이언트가 보내는 system_prompt를 사용하지 않음 (/prompts로 저장된 값, 없으면 서버의 기본 파일에서 로드)
        // const systemPrompt = systemPromptInput.value.trim();
        // if (systemPrompt) {
        //     payload.system_prompt = systemPrompt;
        //     addMessage('📝 시스템 프롬프트 포함하여 전송', 'system');
        // }

        addMessage(`송신: ${JSON.stringify(payload, null, 2)}`, 'sent');

        // 사용자 입력을 히스토리에 추가
        addToHistory(message, 'user');

        currentResponse = '';
        clearResponse();

        try {
            ws.send(JSON.stringify(payload));
            addMessage('📤 메시지 전송 완료', 'system');

            // 메시지 전송 후 입력 필드 클리어
            messageInput.value = '';
            messageInput.focus(); // 포커스 유지
        } catch (error) {
            addMessage(`❌ 전송 오류: ${error.message}`, 'error');
        }
    }

    sendBtn.addEventListener('click', sendMessage);

    clearBtn.addEventListener('click', () => {
        messagesEl.innerHTML = '';
        clearResponse();
        clearHistory();
        // updateCurrentStep(null, null);
        addMessage('로그와 응답 히스토리가 지워졌습니다.', 'system');
    });

    loadPromptBtn.addEventListener('click', () => loadSystemPrompt());
    savePromptBtn.addEventListener('click', saveSystemPrompt);
    resetPromptBtn.addEventListener('click', resetSystemPrompt);

    // 전체 히스토리 복사 기능
    copyHistoryBtn.addEventListener('click', async () => {
        if (responseHistoryEl.classList.contains('empty')) {
            addMessage('⚠️ 복사할 히스토리가 없습니다.', 'system');
            return;
        }

        try {
            // 모든 히스토리 아이템에서 텍스트를 추출
            const historyItems = responseHistoryEl.querySelectorAll('.response-history-item');
            let fullText = '';

            historyItems.forEach((item, index) => {
                const timestamp = item.querySelector('.timestamp').textContent;
                const content = item.querySelector('.content').textContent;
                fullText += `${timestamp}\n${content}\n\n`;
            });

            // 클립보드에 복사
            await navigator.clipboard.writeText(fullText.trim());

            // 성공 피드백
            const originalText = copyHistoryBtn.textContent;
            copyHistoryBtn.textContent = '✅ 복사 완료!';
            copyHistoryBtn.style.background = '#28a745';

            setTimeout(() => {
                copyHistoryBtn.textContent = originalText;
                copyHistoryBtn.style.background = '#17a2b8';
            }, 2000);

            addMessage('📋 전체 히스토리가 클립보드에 복사되었습니다.', 'system');
        } catch (error) {
            addMessage(`❌ 복사 실패: ${error.message}`, 'error');
        }
    });

    // Enter 키로 메시지 전송
    messageInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 페이지 로드 시 초기화
    addMessage('WebSocket 테스트 클라이언트가 준비되었습니다.', 'system');
    addMessage('1. "연결" 버튼을 클릭하세요.', 'system');
    addMessage('2. 연결 후 메시지를 입력하고 Enter로 전송하세요.', 'system');

    // 새로고침·탭 복원 때 브라우저가 이전 입력값을 되살리면 "작성 중"으로 오인해 서버 프롬프트를
    // 불러오지 않으므로, 시작할 때 비워 둔다 (autocomplete="off"로 막지 못하는 브라우저 대비)
    systemPromptInput.value = '';

    // 페이지를 열자마자 서버를 미리 깨운다 (연결 버튼은 이 대기를 공유한다). 깨어나면 현재 프롬프트를 불러온다.
    warmUpServer().then((outcome) => {
        if (outcome === 'warm') {
            autoLoadSystemPrompt();
        } else if (lastSyncedPrompt === null) {
            const reason = outcome === 'booting'
                ? '서버가 응답하지 않아'
                : '서버에 요청하지 못해 (네트워크·차단 확장 프로그램 확인)';
            promptSourceEl.textContent = `${reason} 프롬프트를 불러오지 못했습니다. '현재 프롬프트 불러오기'를 누르거나 '연결'(로그인 후)을 누르면 다시 시도합니다.`;
        }
    });

    // CSS 애니메이션 추가
    const style = document.createElement('style');
    style.textContent = `
        @keyframes blink {
            0%, 50% { opacity: 1; }
            51%, 100% { opacity: 0; }
        }
    `;
    document.head.appendChild(style);
</script>
</body>
</html>
